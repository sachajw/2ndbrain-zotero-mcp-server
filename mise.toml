# Tools and tasks for this repo. `mise install` once, then `mise run <task>`.
[tools]
node = "22.23.5"                   # package.json engines: node >=20
lefthook = "2.2.2"                 # git hooks (lefthook.yml); run by the global dispatcher hooks
"pipx:commitizen" = "4.19.3"       # `cz commit` / `cz check` against .cz.toml
gitleaks = "8.30.1"                # secret scan in the pre-commit hook

[tasks.install]
description = "Install npm dependencies from package-lock.json"
run = "npm ci"

[tasks.build]
description = "Build the MCP server and the Zotero RDP plugin"
run = "npm run build"

[tasks.test]
description = "Run the MCP server tests"
run = "npm test"

[tasks.lint]
description = "Lint every workspace"
run = "npm run lint"

[tasks.typecheck]
description = "Type-check every workspace"
run = "npm run typecheck"

[tasks.hooks]
description = "Run the pre-commit hooks against every file"
run = "lefthook run pre-commit --all-files --no-auto-install"
