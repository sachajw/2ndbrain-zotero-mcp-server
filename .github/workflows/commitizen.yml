# Checks that every commit made on this branch (and a PR's title, used for squash merges)
# follows .cz.toml.
# commitizen's version is read from mise.toml so local hooks and CI run the same release.
name: commitizen

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cz-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install commitizen (version from mise.toml)
        run: |
          version=$(sed -nE 's/^"pipx:commitizen" = "([^"]+)".*/\1/p' mise.toml)
          test -n "$version" || { echo "pipx:commitizen not pinned in mise.toml"; exit 1; }
          python -m pip install "commitizen==$version"

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_AFTER~1..$PUSH_AFTER"   # new branch: check the tip only
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          # First-parent only: the commits made on this branch. Commits merged in
          # from upstream (introfini/mcp-server-zotero-dev) follow upstream's own
          # convention and are not ours to reword. Merge commits themselves pass
          # through commitizen's default "Merge" prefix.
          echo "Checking first-parent commits in $range"
          status=0
          for sha in $(git rev-list --first-parent "$range"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            if cz check --commit-msg-file /tmp/msg >/dev/null 2>&1; then
              echo "ok   $(git log -1 --format='%h %s' "$sha")"
            else
              echo "FAIL $(git log -1 --format='%h %s' "$sha")"; status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Fix the messages above to match .cz.toml (cz check --help)."
          fi
          exit "$status"

      - name: Check PR title (becomes the squash-merge commit)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$TITLE"
